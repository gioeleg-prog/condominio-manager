# Esegue le quattro suite di test (regole Firestore, unitari, integrazione Cloud
# Functions, app nel browser con Playwright) sugli emulatori a ogni pull request
# e a ogni push su main.
# Tutto gira sugli emulatori locali del progetto demo-qa: nessun accesso a
# staging o produzione, nessun segreto necessario.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # L'emulatore di Firestore richiede Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Dipendenze
        run: |
          npm ci
          npm ci --prefix functions
          npm install -g firebase-tools@15

      # Vulnerabilità note nelle librerie che vanno in produzione (Cloud Functions):
      # la CI si ferma solo per gravità alta o critica; le moderate restano visibili
      # nel log e negli avvisi Dependabot.
      - name: Vulnerabilità delle librerie di produzione
        run: |
          npm audit --omit=dev --audit-level=high --prefix functions
          npm audit --omit=dev --audit-level=high

      - name: Unitari (logica di calcolo)
        run: npm run test:unit

      - name: Regole Firestore
        run: npm test

      - name: Integrazione (Cloud Functions, regole, migrazione)
        run: npm run test:functions

      # L'app vera in Chromium contro gli emulatori: accessi per ruolo, spese,
      # conferme, subentro, tema scuro, ricerca, telefono, accessibilità.
      - name: Browser per i test (Chromium)
        run: npx playwright install --with-deps chromium

      - name: App nel browser (Playwright)
        run: npm run test:e2e

      - name: Rapporto dei test nel browser (se falliscono)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-e2e
          path: |
            qa/out/e2e-report
            qa/out/e2e-risultati
          retention-days: 14
